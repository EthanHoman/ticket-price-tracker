name: Check ticket prices

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Also send a test notification to your phone
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install headless browser
        run: |
          pip install -q playwright
          python3 -m playwright install --with-deps chromium > /dev/null

      - name: Check prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python3 check.py

      - name: Save alert state
        run: |
          git diff --quiet -- state.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update alert state"
          git pull --rebase --quiet && git push
